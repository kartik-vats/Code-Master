- name: Check Vercel token
  env:
    VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  run: |
    if [ -z "$VERCEL_TOKEN" ]; then
      echo "❌ VERCEL_TOKEN is EMPTY"
      exit 1
    else
      echo "✅ VERCEL_TOKEN is available"
      echo "Token length: ${#VERCEL_TOKEN}"
    fi

- name: Deploy to Vercel
  env:
    VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  run: vercel --prod --token="$VERCEL_TOKEN" --yes
