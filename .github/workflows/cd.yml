name: CD - Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  check-data:
    name: Check data files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check TypeScript data files
        run: |
          echo "Checking data/*.ts files..."

          failed=0

          for file in data/*.ts; do
            # Make sure the glob matched a real file
            if [ ! -f "$file" ]; then
              continue
            fi

            # Check whether the file contains anything other than whitespace
            if [ -z "$(tr -d '[:space:]' < "$file")" ]; then
              echo "❌ Empty file found: $file"
              failed=1
            else
              echo "✅ $file is not empty"
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "❌ Deployment stopped because one or more data files are empty."
            exit 1
          fi

          echo "✅ All data files are valid."

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: check-data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Deploy to Vercel
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
