name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Check data folder for empty files
        run: |
          if find data -type f -empty | grep -q .; then
            echo "❌ Empty files found in data folder:"
            find data -type f -empty
            exit 1
          fi

          echo "✅ No empty files found in data folder"

      - name: Build application
        run: npm run build
