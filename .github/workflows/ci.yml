name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get repository code
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Check code quality
      - name: Run ESLint
        run: npm run lint

      # 5. Check TypeScript
      - name: Type check
        run: npx tsc --noEmit

      # 6. Build application
      - name: Build application
        run: npm run build
