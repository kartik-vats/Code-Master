name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v5

      # -------------------------
      # Node.js
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # -------------------------
      # Dependencies
      # -------------------------
      - name: Install dependencies
        run: npm ci

      # -------------------------
      # Lint
      # -------------------------
      - name: Run ESLint
        run: npm run lint

      # -------------------------
      # TypeScript
      # -------------------------
      - name: TypeScript type check
        run: npx tsc --noEmit

      # -------------------------
      # Empty data files
      # -------------------------
      - name: Check for empty data files
        run: |
          empty_files=$(find data -type f -empty)

          if [ -n "$empty_files" ]; then
            echo "❌ Empty files found:"
            echo "$empty_files"
            exit 1
          fi

          echo "✅ No empty data files found"

      # -------------------------
      # Tests
      # -------------------------
      - name: Run tests
        run: npm test

      # -------------------------
      # Dependency security
      # -------------------------
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      # -------------------------
      # Production build
      # -------------------------
      - name: Build application
        run: npm run build